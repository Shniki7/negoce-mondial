<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3A68">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="shim.js"></script>
</head>
<body>
<title>Négoce Mondial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: a physical-looking board (ivory cells, continent colour bands, navy centre with a dotted world map) on a warm games-table page; action panel and ledgers on the right, stacked under the board on phones. */
:root{
  --bg:#EFE9DD; --surface:#FFFDF8; --ink:#1C2333; --muted:#626B7A; --line:#DDD3C2; --brand:#1F3A68; --gold:#D9930F; --gold-soft:#FBEBC8; --good:#23884C; --bad:#C2392B;
  /* the board is a physical object: same colours in both themes */
  --b-frame:#1F3A68; --b-cell:#FFFDF6; --b-ink:#1C2333; --b-muted:#6A7180; --b-center:#17294A; --b-center-2:#203862; --b-water:#2B4775;
  --c-am:#E4572E; --c-eu:#2F6BDB; --c-af:#E59A00; --c-as:#12A07A;
  --s-actu:#7B4FD6; --s-ench:#D23F84; --s-joker:#1C2333; --s-douane:#5E6B7D; --s-rec:#2E9D57; --s-depart:#1F3A68;
  --k-agri:#5E9E2F; --k-mine:#7D6B5A; --k-ener:#E07B12; --k-autre:#2F98AA;
  --p1:#E23B3B; --p2:#2C7BE5; --p3:#21A04A; --p4:#9A4FD6; --p5:#F08A00; --p6:#11A3A0;
  --display:"Luckiest Guy","Arial Black",Impact,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161F; --surface:#1B2130; --ink:#EEF1F6; --muted:#9AA3B2; --line:#2C3446; --brand:#9DB8F2; --gold:#F2B83A; --gold-soft:#3A2F14; --good:#4CC27A; --bad:#EE6A5B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161F; --surface:#1B2130; --ink:#EEF1F6; --muted:#9AA3B2; --line:#2C3446; --brand:#9DB8F2; --gold:#F2B83A; --gold-soft:#3A2F14; --good:#4CC27A; --bad:#EE6A5B; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding:0 16px}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding-block:14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:2px 14px;margin-bottom:16px;border-bottom:2px solid var(--line)}
.logo{font-family:var(--display);font-size:30px;line-height:1;color:var(--brand);letter-spacing:.02em}
.logo span{color:var(--gold)}
.logo small{display:block;font-family:var(--body);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-top:4px}
.btn{border:0;background:var(--brand);color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gold{background:var(--gold);color:#1C2333}
.btn.green{background:var(--good)}
.btn.red{background:var(--bad)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.big{font-family:var(--display);font-size:24px;letter-spacing:.03em;padding:12px 20px;width:100%;font-weight:400}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.on{background:var(--gold);color:#1C2333}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.gold):not(.green):not(.red):not(.ghost):not(.on){background:#3B5DA0}}
:root[data-theme="dark"] .btn:not(.gold):not(.green):not(.red):not(.ghost):not(.on){background:#3B5DA0}
.label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.panel h2{font-family:var(--display);font-weight:400;font-size:21px;letter-spacing:.02em;margin:0;line-height:1.1;color:var(--brand)}
.note{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);z-index:10}
.num{font-variant-numeric:tabular-nums}

/* Lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.hero{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:24px;align-items:center;background:var(--b-center);color:#fff;border-radius:20px;padding:28px;overflow:hidden}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(42px,7vw,84px);line-height:.95;margin:0;letter-spacing:.01em;text-wrap:balance}
.hero h1 span{color:#F6B932}
.hero p{max-width:52ch;margin:14px 0 0;color:#C9D4EA;font-size:16px}
.hero canvas{width:100%;height:auto;display:block}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-weight:700;color:var(--ink);width:100%}
.row>.field{flex:1 1 170px}
.tables{display:flex;flex-direction:column;gap:8px}
.tbl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;background:var(--bg);flex-wrap:wrap}
.tbl b{font-weight:800}
.dots{display:flex;gap:4px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.pill{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--ink)}
.pill.open{background:var(--good);color:#fff}
.pill.live{background:var(--gold);color:#1C2333}
.empty{border:2px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);font-size:14px;text-align:center}
details.rules{grid-column:1/-1}
details.rules summary{cursor:pointer;font-family:var(--display);font-size:21px;color:var(--brand)}
.rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px 28px;margin-top:12px}
.rules-grid h3{font-size:15px;margin:0 0 4px;font-weight:900}
.rules-grid p{margin:0;font-size:14px;color:var(--muted);max-width:62ch}

/* Chips & cards */
.rchip{display:inline-flex;align-items:center;gap:4px;background:var(--k);color:#fff;font-weight:800;font-size:12px;border-radius:999px;padding:1px 9px 1px 4px;white-space:nowrap}
.rchip i{font-style:normal;font-size:12px}
.pawn{width:20px;height:20px;flex:none;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 0 2px #fff;vertical-align:middle}
.pawn.me{box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 0 2px #fff,0 0 0 4px var(--gold)}

/* Board */
.game{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}
.board-wrap{min-width:0}
.board{container-type:inline-size;width:100%;max-width:940px;margin:0 auto;aspect-ratio:1;display:grid;grid-template-columns:1.5fr repeat(11,1fr) 1.5fr;grid-template-rows:1.5fr repeat(11,1fr) 1.5fr;gap:.35cqi;background:var(--b-frame);border-radius:2.2cqi;padding:.9cqi;box-shadow:0 1.2cqi 0 #13264A,0 2cqi 4cqi rgba(0,0,0,.25)}
.cell{position:relative;background:var(--b-cell);color:var(--b-ink);border:0;border-radius:.7cqi;padding:0;display:flex;flex-direction:column;align-items:stretch;cursor:pointer;text-align:center;min-width:0;min-height:0;overflow:hidden;font-size:clamp(7px,1.25cqi,15px);line-height:1.05}
.cell:hover{filter:brightness(1.04)}
.cell.sel{box-shadow:inset 0 0 0 .45cqi var(--gold);z-index:1}
.cell.landed{animation:land 1.4s ease-out}
@keyframes land{0%{box-shadow:inset 0 0 0 .8cqi #F6B932}100%{box-shadow:inset 0 0 0 0 #F6B932}}
.cell .band{background:var(--g);color:#fff;font-weight:900;text-transform:uppercase;letter-spacing:.02em;padding:.35cqi .2cqi;font-size:clamp(5px,.82cqi,10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .ico{font-size:clamp(10px,2.3cqi,26px);line-height:1;margin:auto 0 .2cqi}
.cell .rn{font-weight:800;padding:0 .2cqi .5cqi;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .owners{position:absolute;left:.3cqi;bottom:.3cqi;display:flex;gap:.2cqi}
.cell .owners b{width:.9cqi;height:.9cqi;min-width:4px;min-height:4px;border-radius:50%;background:var(--c);display:block}
.cell.special{color:#fff;justify-content:center;gap:.3cqi;background:var(--sc)}
.cell.special .sl{font-family:var(--display);font-weight:400;font-size:clamp(6px,1.05cqi,13px);letter-spacing:.02em;line-height:1;padding:0 .2cqi}
.cell.special .ico{margin:0}
.cell.special .ss{font-size:clamp(5px,.75cqi,9px);font-weight:700;opacity:.9}
.cell.corner .sl{font-size:clamp(8px,1.7cqi,20px)}
.cell.corner .ico{font-size:clamp(12px,3cqi,34px)}
.cell.mondial{background:conic-gradient(from 45deg,var(--c-am),var(--c-eu),var(--c-af),var(--c-as),var(--c-am))}
.cell.mondial .sl,.cell.mondial .ss{text-shadow:0 1px 2px rgba(0,0,0,.6)}
.cell.joker .sl{color:#F6B932}
.pawns{position:absolute;right:.3cqi;top:1.6cqi;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.2cqi;max-width:85%}
.cell.special .pawns{top:.3cqi}
.pawns .pawn{width:clamp(9px,1.8cqi,20px);height:clamp(9px,1.8cqi,20px);font-size:clamp(6px,1cqi,11px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 1.5px #fff}
@container (max-width:460px){.cell .rn,.cell.special .ss{display:none}.cell .band{font-size:clamp(5px,1.2cqi,9px)}}
@container (max-width:340px){.cell .band{color:transparent;padding:.5cqi 0}.cell.special .sl{display:none}.cell.corner .sl{display:block}}

.center{grid-area:2/2/13/13;background:radial-gradient(circle at 50% 35%,var(--b-center-2),var(--b-center) 70%);border-radius:1.2cqi;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:1.2cqi;padding:2cqi;color:#fff;min-width:0;min-height:0;overflow:hidden}
.c-logo{font-family:var(--display);font-size:clamp(18px,5.4cqi,58px);line-height:.9;text-align:center;letter-spacing:.02em;text-shadow:0 .4cqi 0 rgba(0,0,0,.35)}
.c-logo span{color:#F6B932}
.c-meta{font-size:clamp(8px,1.3cqi,14px);font-weight:800;color:#AFC0E0;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.mapbox{position:relative;width:100%;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.mapbox canvas{width:100%;height:auto;max-height:100%;display:block}
.c-row{display:flex;align-items:center;justify-content:center;gap:2.2cqi;flex-wrap:wrap;width:100%}
.dice{display:flex;gap:1.4cqi}
.die{width:clamp(26px,6cqi,62px);aspect-ratio:1;background:#fff;border-radius:22%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13%;box-shadow:inset 0 -.5cqi 0 rgba(0,0,0,.18),0 .4cqi 0 rgba(0,0,0,.35)}
.die.red{background:#E23B3B}
.die i{display:block;margin:auto;width:72%;aspect-ratio:1;border-radius:50%}
.die i.on{background:#1C2333}
.die.red i.on{background:#fff}
.dice.rolling .die{animation:tumble .6s cubic-bezier(.3,1.4,.6,1)}
.dice.rolling .die:nth-child(2){animation-delay:.07s}
@keyframes tumble{0%{transform:rotate(-220deg) scale(.5);opacity:.2}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.dice.rolling .die,.cell.landed{animation:none}}
.turnchip{display:inline-flex;align-items:center;gap:.8cqi;background:rgba(255,255,255,.12);border-radius:999px;padding:.5cqi 1.6cqi .5cqi .6cqi;font-size:clamp(10px,1.6cqi,17px);font-weight:900}
.turnchip .pawn{width:clamp(16px,2.6cqi,28px);height:clamp(16px,2.6cqi,28px)}
.newscard{background:#FFFDF6;color:#1C2333;border-radius:1.4cqi;padding:1.4cqi 2.2cqi;font-size:clamp(10px,1.75cqi,18px);font-weight:700;max-width:92%;text-align:center;box-shadow:0 .4cqi 0 rgba(0,0,0,.3)}
.newscard .k{display:block;font-family:var(--display);font-weight:400;color:var(--s-actu);font-size:clamp(10px,1.8cqi,20px);letter-spacing:.03em}
@container (max-width:520px){.c-meta{display:none}.newscard{font-size:clamp(8px,2cqi,12px)}}

.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.side>div:empty{display:none}
.action{box-shadow:0 0 0 3px var(--brand)}
.action.mine{box-shadow:0 0 0 3px var(--gold),0 6px 18px rgba(217,147,15,.25)}
.auction{box-shadow:0 0 0 3px var(--s-ench)}
.offer{box-shadow:0 0 0 3px var(--good)}
.list{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--bg);font-size:14px}
.trow .tn{min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.trow .pct{font-weight:900;font-variant-numeric:tabular-nums}
.trow.pickable{cursor:pointer}
.trow .ck{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex:none;background:var(--surface)}
.trow.incart{box-shadow:inset 0 0 0 2px var(--gold);background:var(--gold-soft)}
.trow.incart .ck{background:var(--gold);box-shadow:none;color:#1C2333}
.trow.dim{opacity:.5}
.cart{background:var(--gold-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.cart .ct{display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:15px}
.cart .imp{font-size:13px;font-weight:700}
.cart .imp b.up{color:var(--good)}
.trow.picked{box-shadow:inset 0 0 0 2px var(--s-ench)}
@media (min-width:901px){.scroll{max-height:300px;overflow-y:auto}}
.players{display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px}
.pl.turn{background:var(--gold-soft)}
.pl.out{opacity:.45}
.pl .nm{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .sub{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-weight:700}
.pl .cash{font-weight:900;text-align:right;font-variant-numeric:tabular-nums}
.pl .cash small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.tag{font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:1px 7px;background:var(--line);color:var(--ink)}
.tag.warn{background:var(--bad);color:#fff}
.tag.gold{background:var(--gold);color:#1C2333}
.share{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;background:var(--bg)}
.share .sh{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;font-weight:800}
.bar{position:relative;height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--k);border-radius:999px}
.bar i{position:absolute;top:0;bottom:0;width:2px;background:var(--surface);opacity:.9}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;font-weight:800;text-align:center}
.tiers div{padding:3px 2px;border-radius:6px;background:var(--bg);color:var(--muted)}
.tiers div.on{background:var(--k);color:#fff}
.tiers b{display:block;font-size:12px}
.auc-price{font-family:var(--display);font-size:34px;line-height:1;color:var(--s-ench);font-weight:400}
.count{font-family:var(--display);font-size:22px;font-weight:400}
.tradecols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tradecols input{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit;font-weight:700;color:var(--ink)}
.pick{border:0;cursor:pointer}
.pick.on{outline:3px solid var(--gold);outline-offset:1px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;max-height:260px;overflow-y:auto;font-size:13px}
.log li{padding-left:10px;border-left:3px solid var(--line);color:var(--muted)}
.log li:first-child{border-left-color:var(--gold);color:var(--ink);font-weight:700}
.rank{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rank li{display:flex;justify-content:space-between;gap:8px;font-size:15px;align-items:center;font-weight:700}
.rank li:first-child{font-weight:900;font-size:17px}
.loading{min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.tblwrap{overflow-x:auto}

/* Zoom du plateau */
.board{position:relative}
.bctl{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bctl .note{margin-right:auto}
.bview.zoom{overflow:auto;height:min(80vh,920px);border-radius:18px;background:var(--b-frame);overscroll-behavior:contain;-webkit-overflow-scrolling:touch;box-shadow:0 8px 0 #13264A}
.bview.zoom .board{width:175%;max-width:none;margin:0;border-radius:0;box-shadow:none}
@media (max-width:900px){.bview.zoom{height:min(calc(100vw - 32px),62vh)}.bview.zoom .board{width:260%}}
/* Tutoriel */
.coach{position:fixed;z-index:25;left:20px;bottom:24px;width:min(390px,calc(100% - 40px));background:var(--ink);color:var(--bg);border-radius:18px;padding:16px 16px 14px;box-shadow:0 14px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:8px;animation:coachIn .35s ease-out}
.coach[hidden]{display:none}
@keyframes coachIn{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.coach .ck{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.coach b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.1}
.coach p{margin:0;font-size:14.5px;line-height:1.45;font-weight:600}
.coach .btn.ghost{color:inherit;box-shadow:inset 0 0 0 2px currentColor;opacity:.75}
.coach-hi{outline:3px solid var(--gold)!important;outline-offset:3px;border-radius:14px;animation:coachP 1.6s ease-in-out infinite}
@keyframes coachP{50%{outline-offset:8px}}
@media (prefers-reduced-motion:reduce){.coach,.coach-hi{animation:none}}
@media (max-width:900px){.coach{left:10px;right:10px;width:auto;bottom:calc(134px + env(safe-area-inset-bottom,0px));padding:12px 14px;gap:6px}.coach b{font-size:18px}.coach p{font-size:13.5px}.bctl .note{display:none}}
.offer .round{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--good)}
/* Atelier des règles */
.editor{display:flex;flex-direction:column;gap:16px}
.edbar .row{align-items:end}

/* Ordinateurs : une décision à la fois. */
function botReserve(s){ return Math.max(3000, Math.round(s.startCash*0.12)); }
function titleScore(s,pid,id){ const t = TITLES[id], sh = share(s,pid,t.r); const nextTier = tierOf(sh + t.pct) > tierOf(sh) ? 2 : 1; return t.pct * (1 + sh/30) * nextTier; }
function botStep(s){
  if (s.status !== 'playing') return false;
  const p = cur(s); if (!p.bot) return false;
  const who = p.id, res = botReserve(s);
  if (s.phase === 'roll') return ACT.roll(s,who);
  if (s.phase === 'buy'){
    if (s.buy.n < 3){
      const opts = eligible(s,p).filter(id => p.cash - TITLES[id].price >= res && (TITLES[id].pct >= 10 || share(s,who,TITLES[id].r) > 0)).sort((a,b) => titleScore(s,who,b) - titleScore(s,who,a));
      if (opts.length) return ACT.buyTitle(s,who,opts[0]);
    }
    return ACT.endBuy(s,who);
  }
  if (s.phase === 'pick'){
    const mine = owned(s,who);
    if (p.jokers > 0 && mine.reduce((t,id) => t + TITLES[id].price, 0) > 8000) return ACT.useJoker(s,who);
    const sorted = mine.slice().sort((a,b) => (countIn(s,who,TITLES[a].r) >= 4) - (countIn(s,who,TITLES[b].r) >= 4) || TITLES[a].price - TITLES[b].price);
    return ACT.auctionStart(s,who,sorted.slice(0,s.pick.need));
  }
  if (s.phase === 'act'){
    if (s.jokerOffer && !(p.jokers > 0) && p.cash > RULE.jokerPrice + res*2) return ACT.buyJoker(s,who);
    return ACT.end(s,who);
  }
  return false;
}
function botWantsBid(s,bot){
  const a = s.auction; if (!a || bot.out || bot.id === a.seller || a.bidder === bot.id) return 0;
  const lot = a.lots[a.i], val = lot.reduce((t,id) => t + TITLES[id].price * (0.6 + share(s,bot.id,TITLES[id].r)/100), 0);
  const next = a.bidder ? a.price + 100 : a.start;
  return next <= val && bot.cash - next >= botReserve(s) ? next : 0;
}
function botAnswer(s){
  const o = s.offer; if (!o || tradeLocked(s)) return false;
  const bot = byId(s,o.to); if (!bot || !bot.bot) return false;
  if (!validOffer(s,o)) return ACT.refuse(s,bot.id);
  const val = (r,pid) => RES_T[r].reduce((t,id) => t + (s.owners[id] === pid ? TITLES[id].price : 0), 0);
  const gets = o.give.reduce((t,r) => t + val(r,o.from)*(1 + share(s,bot.id,r)/50), 0) + o.cg;
  const loses = o.take.reduce((t,r) => t + val(r,bot.id)*(1.2 + share(s,bot.id,r)/50), 0) + o.ct;
  if (gets >= loses*1.25 && bot.cash >= o.ct) return ACT.accept(s,bot.id);
  /* Contre-proposition : mêmes richesses, l'ordinateur ajuste l'argent pour que l'affaire lui convienne. */
  const human = byId(s,o.from), gap = Math.ceil((loses*1.25 - gets)/500)*500;
  if ((o.round||1) < 3 && human && !human.bot && (o.give.length || o.take.length) && gap <= Math.max(6000, loses)){
    const net = o.cg - o.ct + gap;
    const off = {give:o.take.slice(), take:o.give.slice(), cg: net < 0 ? -net : 0, ct: net > 0 ? net : 0};
    if (human.cash >= off.ct && bot.cash >= off.cg && ACT.counter(s,bot.id,off) !== false) return;
  }
  return ACT.refuse(s,bot.id);
}

async function mutate(fn, arg, silent){
  if (!gid) return;
  for (let i = 0; busy && i < 30; i++) await sleep(100);
  if (busy){ if (!silent) toast('Une action est encore en cours, réessaie.'); return; }
  busy = true; if (!silent) render();
  const ref = db.doc('games/' + gid);
  try {
    if (ref.tx){
      let why = null;
      const out = await ref.tx(d => {
        if (!d){ why = 'gone'; return null; }
        if (!validGame(d)){ why = 'gone'; return null; }
        const s = cleanGame(JSON.parse(JSON.stringify(d)));
        applyRules(s.rules); applyTheme(s.options && s.options.theme);
        if (fn(s, me.id, arg) === false){ why = 'refused'; return null; }
        why = null; stamp(s); return s;
      });
      if (why === 'gone') toast("Cette partie n'existe plus.");
      else if (why === 'refused'){ if (!silent) toast('Action impossible pour le moment.'); }
      else if (out) game = out;
      return;
    }
    let ok = false;
    for (let i=0; i<12; i++){
      const r = await ref.acquire({holder: me.id, ttlMs: 5000});
      if (r.acquired){ ok = true; break; }
      await sleep(200 + Math.random()*350);
    }
    if (!ok){ if (!silent) toast('La partie est occupée, réessaie dans un instant.'); return; }
    const snap = await ref.get();
    if (!snap.exists){ toast("Cette partie n'existe plus."); return; }
    const s = JSON.parse(JSON.stringify(snap.data()));
    if (!validGame(s)){ toast("Cette partie n'existe plus."); return; }
    cleanGame(s);
    applyRules(s.rules); applyTheme(s.options && s.options.theme);
    if (fn(s, me.id, arg) === false){ if (!silent) toast('Action impossible pour le moment.'); return; }
    stamp(s);
    game = s;
    await ref.set(s);
  } catch(e){
    if (e && e.code === 'invalid_argument'){ if (STANDALONE) toast("Firebase a refusé cette action (règles de sécurité Firestore). Recharge la page."); else { canWrite = false; toast("Tu n'as pas le droit de jouer sur cette page. Demande au propriétaire de t'inviter comme éditeur."); } }
    else toast('La connexion a échoué. Réessaie.');
  } finally { busy = false; render(); }
}
function openGame(id){
  seenChat = null;
  if (!id){ try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} }
  if (unsubGame){ unsubGame(); unsubGame = null; }
  gid = id; game = null; sel = null; lastStatus = null; lastPay = null; posMem = {}; feedN = null; sheetPid = null; confirmKey = null; lastRoll = null; lastLand = null; lastCard = null; followKey = null; picks = []; bidAmt = null;
  draft = {open:false, to:null, give:[], take:[], cg:0, ct:0};
  store.set('nm.game', id);
  render();
  if (!id){ listWatch(true); return; }
  listWatch(false);
  let had = false;
  unsubGame = db.doc('games/' + id).onSnapshot(snap => {
    if (gid !== id) return;
    const d = snap.exists ? snap.data() : null;
    if (!validGame(d)){ if (had) toast("Cette partie a été supprimée par son hôte."); game = null; gid = null; store.set('nm.game', null); listWatch(true); render(); return; }
    had = true; cleanGame(d);

}

/* Codes sans caractères ambigus (pas de O/0 ni I/1/L). */

function cleanGame(d){
  const N = v => Number.isFinite(+v) ? +v : 0;
  ['round','turn','seq','updatedAt','createdAt','startedAt','turnAt','endsAt','rollSeq','landSeq','deckPos','jokersLeft','bankrupts','startCash'].forEach(k => { if (k in d) d[k] = N(d[k]); });
  d.players.forEach(p => { ['cash','pos','laps','jokers','seen'].forEach(k => { if (k in p) p[k] = N(p[k]); }); p.pos = Math.max(0, Math.min(LAYOUT.length - 1, Math.round(p.pos || 0))); p.color = pcol(p.color); });
  if (d.turn >= d.players.length || d.turn < 0) d.turn = 0;
  if (d.owners && typeof d.owners === 'object') Object.keys(d.owners).forEach(k => { if (!isTid(k)) delete d.owners[k]; }); else d.owners = {};
  if (Array.isArray(d.dice)) d.dice = d.dice.map(v => Math.max(0, Math.min(6, Math.round(N(v)))));
  const a = d.auction; if (a){ ['i','start','price','dur','tick'].forEach(k => { a[k] = N(a[k]); }); a.lots = Array.isArray(a.lots) ? a.lots.map(l => (Array.isArray(l) ? l : []).filter(id => isTid(id))) : []; if (!a.lots[a.i]) d.auction = null; }
  if (d.pick) d.pick.need = Math.max(1, N(d.pick.need));
  if (d.buy){ d.buy.left = N(d.buy.left); d.buy.n = N(d.buy.n); }
  if (d.offer){ d.offer.cg = N(d.offer.cg); d.offer.ct = N(d.offer.ct); d.offer.round = N(d.offer.round) || 1; ['give','take'].forEach(k => { d.offer[k] = (Array.isArray(d.offer[k]) ? d.offer[k] : []).filter(r => RES[r]); }); }
  const o = d.options; o.mode = ['classic','rapide','chrono'].includes(o.mode) ? o.mode : 'classic'; o.theme = o.theme === 'noir' ? 'noir' : 'classique';
  o.minutes = Math.max(5, Math.min(240, Math.round(N(o.minutes)) || 45)); o.practice = !!o.practice; o.rulesName = o.rulesName ? String(o.rulesName).replace(/[<>]/g, '').slice(0, 40) : null;
  if (!Array.isArray(d.log)) d.log = [];
  return d;
}
function validGame(d){ return !!(d && d.v === 3 && Array.isArray(d.players) && d.options && typeof d.options === 'object' && typeof d.code === 'string' && d.players.every(p => p && typeof p.id === 'string' && typeof p.name === 'string')); }

/* L'hôte fait jouer les ordinateurs ; chacun peut clore une enchère expirée. */
/* Le pilote des ordinateurs : l'hôte s'il est là, sinon le premier joueur présent. */
function driverId(s){
  const fresh = s.players.filter(p => !p.bot && (p.id === me.id || Date.now() - (p.seen || 0) < 75000));
  if (fresh.some(p => p.id === s.host)) return s.host;
  return fresh.length ? fresh[0].id : s.host;
}
let aucClock = {key:null, end:0};
function aucEnd(a){
  const k = gid + '|' + (a.tick || 0) + '|' + (a.i || 0);
  if (aucClock.key !== k) aucClock = {key:k, end: Date.now() + (a.dur || RULE.aucSecs)*1000};
  return aucClock.end;
}
function drive(){
  if (!game || game.status !== 'playing' || busy || botTimer || !canWrite || !me.id) return;
  const s = game, a = s.auction, isHost = driverId(s) === me.id || Date.now() - (s.updatedAt || 0) > 20000;
  if (!byId(s, me.id) && !isHost) return;
  if (s.phase === 'auction' && a){
    const late = Date.now() - aucEnd(a), seller = byId(s,a.seller), tick = a.tick;
    const resolver = (a.seller === me.id) || (isHost && (!seller || seller.bot || seller.out)) || late > 4000;
    if (late >= 0 && resolver){ botTimer = setTimeout(() => { botTimer = null; mutate((st,w) => ACT.resolveLot(st,w,tick), null, true); }, 300 + rnd(400)); return; }
    if (isHost && late < -1500){
      const bots = alive(s).filter(p => p.bot && botWantsBid(s,p));
      if (bots.length && Math.random() < 0.35){ const b = bots[rnd(bots.length)]; botTimer = setTimeout(() => { botTimer = null; mutate(st => { const v = botWantsBid(st, byId(st,b.id)); return v ? ACT.bid(st,b.id,v) : false; }, null, true); }, 900 + rnd(1800)); }
    }
    return;
  }
  if (!isHost) return;
  const o = s.offer;
  if (o && !tradeLocked(s) && byId(s,o.to) && byId(s,o.to).bot){ botTimer = setTimeout(() => { botTimer = null; mutate(st => botAnswer(st), null, true); }, 1500); return; }
  if (cur(s).bot){ botTimer = setTimeout(() => { botTimer = null; mutate(st => botStep(st), null, true); }, 1200 + rnd(300)); }
}
let lastSkip = false;
function canSkip(s){ if (!s || s.status !== 'playing' || s.phase === 'auction') return false; const c = cur(s), m = byId(s, me.id); return !!(m && !m.out && !c.bot && c.id !== me.id && (s.host === me.id || absent(s,c))); }
/* Battement de présence toutes les 45 s tant que la partie est ouverte et visible. */
setInterval(() => { if (game && gid && byId(game, me.id) && game.status !== 'closed' && !busy && document.visibilityState !== 'hidden') mutate(ACT.ping, null, true); }, 60000);
setInterval(() => {
  if (!game) return;
  const el = document.getElementById('aCount');
  if (el && game.auction){ const t = Math.max(0, Math.ceil((aucEnd(game.auction) - Date.now())/1000)); el.textContent = t > 0 ? `${t} s` : 'Adjugé…'; }
  const sk = canSkip(game); if (sk !== lastSkip){ lastSkip = sk; render(); }
  const ch = document.getElementById('chrono');
  if (ch && game.endsAt && game.status === 'playing'){ const t = Math.max(0, game.endsAt - Date.now()); ch.textContent = `${Math.floor(t/60000)}:${String(Math.floor(t/1000)%60).padStart(2,'0')}`; }
  drive();
}, 500);

const MAP_ROWS = MAP.split('|'), MW = MAP_ROWS[0].length, MH = MAP_ROWS.length;
const MAPCOL = {a:'#F07655', e:'#5A8CF0', f:'#F5B731', s:'#2DBE92'};
function drawMap(canvas, s){
  const w = canvas.clientWidth; if (!w) return;
  const dpr = window.devicePixelRatio || 1, cell = w / MW, h = cell * MH;
  canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr); canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  for (let y=0; y<MH; y++) for (let x=0; x<MW; x++){
    const ch = MAP_ROWS[y][x];
    ctx.fillStyle = ch === '.' ? 'rgba(255,255,255,.07)' : MAPCOL[ch];
    ctx.beginPath(); ctx.arc(x*cell + cell/2, y*cell + cell/2, cell*(ch === '.' ? .16 : .38), 0, Math.PI*2); ctx.fill();
  }
  if (!s) return;
  const selZone = CELLS[sel] && CELLS[sel].z;
  Object.keys(ZONES).forEach(z => {
    const Z = ZONES[z], x = (Z.lon + 168)/360*w, y = (76 - Z.lat)/126*h;
    const holders = alive(s).filter(p => ZONE_T[z].some(id => s.owners[id] === p.id));
    const r = Math.max(4, cell*.9);
    ctx.fillStyle = '#FFFDF6'; ctx.beginPath(); ctx.arc(x,y,r + (z === selZone ? 3 : 1.5),0,Math.PI*2); ctx.fill();
    if (z === selZone){ ctx.strokeStyle = '#F6B932'; ctx.lineWidth = 3; ctx.stroke(); }
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--c-' + Z.g).trim() || '#888';
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    holders.slice(0,4).forEach((p,k) => {
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue(pcol(p.color)).trim();
      const ang = -Math.PI/2 + k*Math.PI/2; ctx.beginPath(); ctx.arc(x + Math.cos(ang)*r*1.15, y + Math.sin(ang)*r*1.15, r*.42, 0, Math.PI*2); ctx.fill();
    });
  });
}

async function findByCode(code){
  const g = games.find(x => x.code === code && x.status !== 'closed'); if (g) return g;
  try { const c = db.collection('games');
    if (c.where){ const snap = await c.where('code', '==', code).limit(5).get();
      return snap.docs.map(d => Object.assign({_id: d.id}, d.data())).find(x => { try { return validGame(x) && !!cleanGame(x) && x.status !== 'closed'; } catch(e){ return false; } }) || null; } } catch(e){}
  /* Sans recherche par code : on attend la liste des parties récentes. */
  listWatch(true); for (let i = 0; i < 50 && !listLoaded; i++) await sleep(100);
  return games.find(x => x.code === code && x.status !== 'closed') || null;
}

/* ---------- Déplacement des pions ---------- */
function afterMove(fn){ if (moving) moveQ.push(fn); else fn(); }
function moveDone(){ moving = false;
  if (game && gid) render();
  const mb = moveBack; moveBack = null;
  if (mb && Math.abs(scrollY - mb.y1) < 60) setTimeout(() => window.scrollTo({top: mb.y0, behavior: reducedMotion() ? 'auto' : 'smooth'}), 500); const st = document.getElementById('moveHide'); if (st) st.remove(); const q = moveQ; moveQ = []; q.forEach(f => { try { f(); } catch(e){} }); }
function startMove(m){
  const n = (m.to - m.from + N) % N;
  if (!n || n > 12 || reducedMotion()){ return; }
  const v = document.getElementById('bview'); if (!v) return;
  moving = true;
  /* Sur téléphone, si le plateau est hors de l'écran, on le montre le temps du déplacement puis on revient. */
  moveBack = null;
  const bw = v.closest('.board-wrap');
  if (isPhone() && bw && tab === 'jeu'){ const r = bw.getBoundingClientRect();
    if (r.top < 0 || r.top > innerHeight * 0.45){ const y0 = scrollY, y1 = Math.max(0, y0 + r.top - 64); moveBack = {y0, y1}; window.scrollTo({top: y1, behavior:'smooth'}); } }
  let st = document.getElementById('moveHide'); if (!st){ st = document.createElement('style'); st.id = 'moveHide'; document.head.appendChild(st); }
  st.textContent = `#board .pawn[data-pid="${String(m.p.id).replace(/["\\]/g, '')}"]{visibility:hidden}`;
  const old = v.querySelector('.mover'); if (old) old.remove();
  const mv = document.createElement('span'); mv.className = 'mover'; mv.style.setProperty('--c', `var(${pcol(m.p.color)})`);
  mv.textContent = (m.p.name || '?').slice(0,1).toUpperCase(); v.appendChild(mv);
  const at = i => { const b = document.getElementById('board'), c = b && b.children[i]; if (!c) return null;
    const r = c.getBoundingClientRect(), vr = v.getBoundingClientRect();
    return {x: r.left - vr.left + v.scrollLeft + r.width/2, y: r.top - vr.top + v.scrollTop + r.height/2, w: r.width}; };
  const place = i => { const p = at(i); if (!p) return; const sz = Math.max(18, Math.min(36, p.w*0.5)); mv.style.width = mv.style.height = sz + 'px'; mv.style.fontSize = Math.round(sz*0.5) + 'px'; mv.style.transform = `translate(${p.x - sz/2}px, ${p.y - sz/2}px)`; };
  mv.style.transition = 'none'; place(m.from);
  let k = 0; const STEP = n > 8 ? 130 : 170;
  const tick = () => {
    k++; const i = (m.from + k) % N;
    mv.style.transition = `transform ${STEP-20}ms ease-out`; place(i);
    mv.classList.remove('hop'); void mv.offsetWidth; mv.classList.add('hop');
    if (zoomOn && (k % 2 === 0 || k === n)) centerOn(i, 'smooth');
    if (k < n) setTimeout(tick, STEP);
    else setTimeout(() => { mv.remove(); const c = document.getElementById('board').children[m.to]; if (c){ c.classList.remove('landed'); void c.offsetWidth; c.classList.add('landed'); } moveDone(); }, STEP + 120);
  };
  setTimeout(tick, 480);
  setTimeout(() => { if (moving) moveDone(); }, 480 + n*STEP + 1500);
}

/* ---------- Fil en direct : les derniers événements, les nouveaux s'animent ---------- */
function feedHTML(s){
  if (s.status === 'lobby') return '';
  const n = s.logN || s.log.length;

  const isNew = k => Date.now() < feedMark.until && n - k > feedMark.n;
  const last = s.log.slice(-4).reverse();
  const ico = l => /royalties/.test(l) ? '💸' : /enchérit|Adjugé|enchères|banque rachète/.test(l) ? '🔨' : /achète/.test(l) ? '🛒' : /lance/.test(l) ? '🎲' : /faillite|abandonne/.test(l) ? '💥' : /reçoit/.test(l) ? '💰' : /carte|tire/.test(l) ? '📰' : /Transaction|propose|contre-proposition/.test(l) ? '🤝' : '•';

      else hint = `<p class="hint">Pour ${next} % il te manque <b>${need} %</b>, uniquement par transaction ou aux enchères.</p>`;
      return `<div class="rcard" style="--k:var(--k-${RES[r].k})">

      ${cart.length ? `<div class="cartdock"><div class="cart"><div class="ct"><span>Sélection : ${cart.length} titre${cart.length>1?'s':''}</span><span class="num">${fmt(total)}</span></div>
        <div class="note">Il te restera <b class="num">${fmt(after)}</b>.</div>${impact}</div>
        <button class="btn gold big" data-act="cartBuy" ${dis}>Acheter et terminer</button></div>
        <div class="row"><button class="btn sm ghost" data-act="cartStay" ${dis}>Acheter sans terminer</button><button class="btn sm ghost" data-act="cartClear">Tout décocher</button><button class="btn sm ghost" data-act="endBuy" ${dis}>Terminer sans acheter</button></div>`
      : `<div class="cartdock"><button class="btn big" data-act="endBuy" ${dis}>${b.n ? 'Terminer' : 'Ne rien acheter'}</button></div>`}
      ${sold ? `<div class="label">Déjà vendus</div><div class="list">${sold}</div>` : ''}
      ${b.res ? `<p class="note">En terminant, tu paies les royalties ${esc(RES[b.res].n)} aux joueurs qui en détiennent au moins ${TIER_MIN[0]} %.</p>` : ''}</section>`;
  }
  if (s.phase === 'pick'){
    const need = s.pick.need, mine = owned(s, meP.id).sort((x,y) => TITLES[x].r.localeCompare(TITLES[y].r) || TITLES[y].pct - TITLES[x].pct);
    picks = picks.filter(id => s.owners[id] === me.id);
    let count = picks.length; Object.keys(RES).forEach(r => { if (countIn(s,me.id,r) >= 4 && picks.some(id => TITLES[id].r === r)) count += RES_T[r].filter(id => s.owners[id] === me.id && !picks.includes(id)).length; });
    return `<section class="panel action mine"><h2>${SPEC.ench.i} ${THEME === 'noir' ? 'Saisie de la police' : 'Enchères obligatoires'}</h2>
      <p class="note">Le dé rouge impose <b>${need}</b> titre${need>1?'s':''} à vendre. Sélectionnés : <b>${count}</b>. Un titre d'un monopole de 4 titres ou plus entraîne tout le monopole. Prix indiqué : mise de départ (${RULE.aucStart} % du prix).</p>
      <div class="list scroll">${mine.map(id => `<div class="trow pickable${picks.includes(id)?' picked':''}" data-act="pickT" data-id="${id}" role="button" tabindex="0"><span class="tn">${rchip(TITLES[id].r)} <span class="note">${esc(ZONES[TITLES[id].z].n)}</span></span><span class="pct">${TITLES[id].pct} %</span><span class="num">${fmt(Math.round(TITLES[id].price*RULE.aucStart/100))}</span></div>`).join('')}</div>
      <button class="btn big" style="background:var(--s-ench)" data-act="auctionGo" ${dis} ${count < need ? 'disabled' : ''}>Ouvrir les enchères</button>
      ${meP.jokers > 0 ? `<button class="btn gold" data-act="useJoker" ${dis}>${SPEC.joker.i} Jouer ${THEME === 'noir' ? 'ton avocat' : 'un Joker'} (il t'en reste ${meP.jokers})</button>` : ''}</section>`;
  }
  return `<section class="panel action mine"><h2>${esc(cellLabel(meP.pos))}</h2>
    <p class="note">Liquidités : <b class="num">${fmt(meP.cash)}</b></p>
    ${s.jokerOffer ? `<button class="btn gold" data-act="buyJoker" ${dis} ${meP.cash < RULE.jokerPrice ? 'disabled' : ''}>${SPEC.joker.i} ${THEME === 'noir' ? 'Engager un avocat' : 'Acheter un Joker'} · ${fmt(RULE.jokerPrice)}</button>` : ''}
    <button class="btn big" data-act="end" ${dis}>Terminer le tour</button></section>`;
}

function auctionHTML(s, meP){
  const a = s.auction; if (!a || s.phase !== 'auction') return '';
  const seller = byId(s,a.seller), lot = a.lots[a.i], b = a.bidder ? byId(s,a.bidder) : null;
  const canBid = meP && !meP.out && meP.id !== a.seller && canWrite;
  const next = a.bidder ? a.price + 100 : a.start;
  const steps = a.bidder ? [100,500,1000,5000] : [0,500,1000,5000];
  return `<section class="panel auction"><h2>🔨 Enchères · lot ${a.i+1}/${a.lots.length}</h2>
    <p class="note">Vendeur : ${pawn(seller)} ${esc(seller.name)} · mise de départ ${fmt(a.start)}</p>
    <div class="list">${lot.map(id => titleRow(s,id,fmt(TITLES[id].price))).join('')}</div>
    <div class="row" style="justify-content:space-between"><div><div class="label">Meilleure offre</div><div class="auc-price num">${b ? fmt(a.price) : '—'}</div><div class="note">${b ? `${pawn(b)} ${esc(b.name)}` : 'Aucune offre pour le moment'}</div></div>
      <div style="text-align:right"><div class="label">Temps</div><div class="count num" id="aCount"></div></div></div>
    ${canBid ? `<div class="row">${steps.map(st => { const v = (a.bidder ? a.price : a.start) + st; return `<button class="btn sm ${st===0||st===100?'gold':''}" data-act="bid" data-id="${v}" ${busy || meP.cash < v || a.bidder === me.id ? 'disabled' : ''}>${st===0 ? 'Mise' : '+' + fmt(st)} · ${fmt(v)}</button>`; }).join('')}</div>
      <p class="note">${a.bidder === me.id ? 'Tu as la meilleure offre.' : `Offre minimale : ${fmt(next)}. Chaque offre relance le compte à rebours de ${RULE.aucSecs} secondes.`}</p>`
      : `<p class="note">${meP && meP.id === a.seller ? "Tu reçois le prix de la meilleure offre. Sans enchérisseur, la banque rachète à la mise de départ." : 'Tu ne peux pas enchérir.'}</p>`}
  </section>`;
}

function offerHTML(s){
  const o = s.offer; if (!o || s.status !== 'playing') return '';
  const f = byId(s,o.from), t = byId(s,o.to); if (!f || !t) return '';
  const part = (rs,pid,cash) => `<div class="row">${rs.map(r => `${rchip(r)} <span class="note">${share(s,pid,r)} %</span>`).join(' ')}${cash ? `<b class="num">${fmt(cash)}</b>` : ''}${!rs.length && !cash ? '<span class="note">rien</span>' : ''}</div>`;
  const dis = busy || !canWrite ? 'disabled' : '';
  const rnd_ = (o.round||1) > 1 ? `<div class="round">Contre-proposition${(o.round||1) > 2 ? ' n°' + ((o.round||1) - 1) : ''}</div>` : '';
  if (o.to === me.id){
    if (draft.open && draft.counter) return `<section class="panel offer">${composerHTML(s, byId(s,me.id))}</section>`;
    return `<section class="panel offer">${rnd_}<h2>${(o.round||1) > 1 ? 'Réponse' : 'Proposition'} de ${esc(f.name)}</h2><div><div class="label">Tu reçois</div>${part(o.give,f.id,o.cg)}</div><div><div class="label">Tu donnes</div>${part(o.take,t.id,o.ct)}</div>
    ${tradeLocked(s) ? `<p class="note">⏸️ Transactions suspendues pendant ${THEME === 'noir' ? 'la saisie' : 'les enchères'} : tu pourras répondre juste après.</p>` : ''}
    <div class="row"><button class="btn green" data-act="accept" ${dis} ${tradeLocked(s) ? 'disabled' : ''}>Accepter</button><button class="btn gold" data-act="counterOpen" ${dis} ${tradeLocked(s) ? 'disabled' : ''}>Contre-proposer</button><button class="btn ghost" data-act="refuse" ${dis}>Refuser</button></div></section>`;
  }
  if (o.from === me.id) return `<section class="panel offer">${rnd_}<h2>${(o.round||1) > 1 ? 'Contre-proposition envoyée' : 'Proposition envoyée'}</h2><p class="note">En attente de ${esc(t.name)}.</p><div><div class="label">Tu donnes</div>${part(o.give,f.id,o.cg)}</div><div><div class="label">Tu demandes</div>${part(o.take,t.id,o.ct)}</div>
    <button class="btn sm ghost" data-act="refuse" ${dis}>Retirer</button></section>`;
  return `<section class="panel"><p class="note">Transaction en discussion entre ${esc(f.name)} et ${esc(t.name)}.</p></section>`;
}

      <div style="min-width:0"><div class="nm">${esc(p.name)}${p.id === me.id ? ' (toi)' : ''}</div><div class="sub">${s.status === 'lobby' ? '' : `<span>${owned(s,p.id).length} titres</span>`}${tags}</div></div>

function payHereHTML(s,r){

    <div class="list">${RES_T[r].slice().sort((a,b) => TITLES[b].pct - TITLES[a].pct).map(id => titleRow(s,id)).join('')}</div>`;

function mineHTML(s, meP){

  }).join('')}</section>`;
}

function draftOk(s, meP){
  const any = draft.give.length || draft.take.length || draft.cg || draft.ct;
  const slot = draft.counter ? !!(s.offer && s.offer.to === me.id) : !s.offer;
  return !!(any && slot && meP && draft.cg <= meP.cash);
}
function tradeHTML(s, meP){
  const others = alive(s).filter(p => p.id !== me.id);
  if (!others.length) return '';
  if (!draft.open || draft.counter) return `<section class="panel"><h2>Transactions</h2><p class="note">Échange tous tes titres d'une richesse contre ceux d'un autre joueur, avec ou sans argent, à tout moment. L'autre joueur peut accepter, refuser ou te faire une contre-proposition.</p><button class="btn ghost" data-act="tradeOpen" ${s.offer ? 'disabled' : ''}>${s.offer ? 'Une transaction est déjà en cours' : 'Proposer une transaction'}</button></section>`;
  return `<section class="panel">${composerHTML(s, meP)}</section>`;
}
function composerHTML(s, meP){
  const others = alive(s).filter(p => p.id !== me.id);
  if (!draft.counter && (!draft.to || !byId(s,draft.to) || byId(s,draft.to).out)){ draft.to = others[0].id; draft.take = []; }
  const other = byId(s, draft.to); if (!other) return '';
  const mineR = ownedRes(s, me.id), theirR = ownedRes(s, draft.to);
  draft.give = draft.give.filter(r => mineR.includes(r)); draft.take = draft.take.filter(r => theirR.includes(r));
  const pickB = (r,list,pid) => `<button class="rchip pick${draft[list].includes(r)?' on':''}" style="--k:var(--k-${RES[r].k})" data-act="tpick" data-kind="${list}" data-id="${r}"><i>${RES[r].i}</i>${esc(RES[r].n)} ${share(s,pid,r)} %</button>`;
  const ok = draftOk(s, meP);
  return `<h2>${draft.counter ? `Ta contre-proposition à ${esc(other.name)}` : 'Proposer une transaction'}</h2>
    ${draft.counter ? "<p class=\"note\">Modifie les richesses ou l'argent, puis renvoie. Ta proposition remplace la sienne.</p>" : `<div><div class="label">Avec</div><div class="row">${others.map(p => `<button class="btn sm ${draft.to===p.id?'on':'ghost'}" data-act="tto" data-id="${esc(p.id)}">${pawn(p)} ${esc(p.name)}</button>`).join('')}</div></div>`}
    <div class="tradecols">
      <div class="field"><div class="label">Je donne</div><div class="row">${mineR.length ? mineR.map(r => pickB(r,'give',me.id)).join('') : '<span class="note">Aucune richesse</span>'}</div>
        <label class="label" for="tGive">+ argent (en M€)</label><input id="tGive" type="number" min="0" step="0.5" inputmode="decimal" value="${draft.cg ? draft.cg/1000 : ''}"></div>
      <div class="field"><div class="label">Je demande</div><div class="row">${theirR.length ? theirR.map(r => pickB(r,'take',draft.to)).join('') : '<span class="note">Aucune richesse</span>'}</div>
        <label class="label" for="tTake">+ argent (en M€)</label><input id="tTake" type="number" min="0" step="0.5" inputmode="decimal" value="${draft.ct ? draft.ct/1000 : ''}"></div>
    </div>
    <div class="row"><button class="btn green" data-act="tsend" ${ok && !busy && canWrite ? '' : 'disabled'}>${draft.counter ? 'Envoyer la contre-proposition' : 'Envoyer la proposition'}</button><button class="btn ghost" data-act="tclose">${draft.counter ? 'Retour' : 'Annuler'}</button></div>
    ${other.bot ? "<p class=\"note\">Les ordinateurs acceptent les affaires nettement à leur avantage. Sinon, ils te répondent par une contre-proposition en ajustant l'argent.</p>" : ''}`;
}

let zoomOn = null, followKey = null, lastStatus = null;
const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function centerOn(i, behavior){
  const v = document.getElementById('bview'), b = document.getElementById('board');
  if (!v || !b || !v.classList.contains('zoom') || v.offsetParent === null) return false;
  const el = b.children[i]; if (!el) return false;
  v.scrollTo({left: el.offsetLeft + el.offsetWidth/2 - v.clientWidth/2, top: el.offsetTop + el.offsetHeight/2 - v.clientHeight/2, behavior: reducedMotion() ? 'auto' : behavior});
  return true;
}
/* Suit le pion qui vient de bouger ; revient sur le tien quand c'est ton tour. */
function follow(s, meP, myTurn, force){
  if (moving && !force) return;
  let pos = null, key = null;
  if (myTurn && meP){ pos = meP.pos; key = 'me|' + s.turn + '|' + (s.landSeq||0); }
  else if (s.lastLand){ pos = s.lastLand.pos; key = 'l|' + (s.landSeq||0); }
  else if (meP){ pos = meP.pos; key = 'start'; }
  if (pos === null || (!force && key === followKey)) return;
  const first = followKey === null;
  if (centerOn(pos, first ? 'auto' : 'smooth')) followKey = key;
}

/* =================== AUDIT MATHÉMATIQUE =================== */
/* Calcul pur à partir d'un jeu de règles : rien ne dépend de la partie en cours. */
function auditRules(R, nPlayers){
  const opp = Math.max(1, nPlayers - 1);
  const cells = LAYOUT.map((x,i) => { const c = parseCell(x); if ((c.t === 'pays' || c.t === 'rec') && R.cells[i]) c.r = R.cells[i]; return c; });
  const cellsOf = {}; cells.forEach(c => { if (c.r) cellsOf[c.r] = (cellsOf[c.r] || 0) + 1; });
  const base = r => Math.max(50, Math.round(R.res[r].v/R.div/50)*50);
  const rows = Object.keys(RES).map(r => {
    const ts = Object.entries(R.res[r].t).filter(([,p]) => p > 0).map(([z,p]) => ({z, p, price:titlePrice(R.res[r].v, p)})).sort((a,b) => b.p - a.p);
    const tot = ts.reduce((t,x) => t + x.p, 0), max = ts.length ? ts[0].p : 0, nc = cellsOf[r] || 0;
    const tiers = R.tiers.map((m,k) => {
      if (tot < m) return null;
      let acc = 0, cost = 0, n = 0; for (const x of ts){ if (acc >= m) break; acc += x.p; cost += x.price; n++; }
      const roy = Math.round(base(r)*R.mult[k]/50)*50, inc = opp*nc*roy/48;
      return {m, n, cost, roy, payback: inc > 0 ? cost/inc : Infinity};
    });
    const issues = [];
    if (!nc) issues.push(['bad', "Aucune case sur le plateau : ses royalties ne sont jamais payées."]);
    if (tot < R.tiers[1]) issues.push(['bad', `Total ${tot} % : le monopole (${R.tiers[1]} %) est impossible.`]);
    else if (tot < R.tiers[2]) issues.push(['warn', `Total ${tot} % : le palier ${R.tiers[2]} % est inaccessible.`]);
    else if (tot < R.tiers[3]) issues.push(['info', `Total ${tot} % : le palier ${R.tiers[3]} % est inaccessible.`]);
    if (tot > 100) issues.push(['warn', `Total ${tot} % : plus que toute la production mondiale.`]);
    if (max >= R.tiers[1]) issues.push(['warn', `Un seul titre (${max} %) suffit pour le monopole.`]);
    if (nc >= 2) issues.push(['info', `${nc} cases sur le plateau : ${nc} fois plus rentable qu'une richesse à une case.`]);
    return {r, ts, tot, max, nc, tiers, issues};
  });
  const mono = rows.map(x => x.tiers[1] && x.tiers[1].payback).filter(v => v && isFinite(v)).sort((a,b) => a - b);
  const median = mono.length ? mono[Math.floor(mono.length/2)] : 0;
  rows.forEach(x => { const p = x.tiers[1] && x.tiers[1].payback;
    if (p && isFinite(p) && median && p < median*0.6) x.issues.push(['warn', `Monopole amorti en ${p.toFixed(1)} tours contre ${median.toFixed(1)} en médiane : trop rentable.`]);
    if (p && isFinite(p) && median && p > median*1.6) x.issues.push(['warn', `Monopole amorti en ${p.toFixed(1)} tours contre ${median.toFixed(1)} en médiane : peu rentable.`]); });
  const cellIssues = [];
  cells.forEach((c,i) => { if (c.t === 'pays' && !R.res[c.r].t[c.z]) cellIssues.push(`Case ${i} · ${ZONES[c.z].n} → ${RES[c.r].n} : ce pays ne produit pas cette richesse dans tes règles.`); });
  const market = rows.reduce((t,x) => t + x.ts.reduce((u,y) => u + y.price, 0), 0);
  const cash = R.start[nPlayers]*nPlayers;
  const nRec = cells.filter(c => c.t === 'rec').length, nActu = cells.filter(c => c.t === 'actu').length, news = R.news || DEFAULT_NEWS;
  const ev = {rec: nRec/48*R.rec*7, dbl: R.dbl*21/36, actu: news.length ? nActu/48*news.reduce((t,c) => t + c.d, 0)/news.length : 0};
  const yieldT = R.tiers.map((m,k) => R.mult[k]/R.div/(m/100));
  return {rows, median, cellIssues, market, cash, ev, opp, yieldT, nPlayers};
}

    case 'cartStay': { const ids = cart.slice(); cart = []; mutate(ACT.buyMany, {ids, end:false}); break; }
    case 'pickT': { const i = picks.indexOf(id); if (i >= 0) picks.splice(i,1); else picks.push(id); render(); break; }
    case 'auctionGo': { const p = picks.slice(); picks = []; mutate(ACT.auctionStart, p); break; }
    case 'bid': mutate(ACT.bid, Number(id)); break;
    case 'tradeOpen': draft = {open:true, to:null, give:[], take:[], cg:0, ct:0}; render(); break;
    case 'counterOpen': { const o = game && game.offer; if (!o || o.to !== me.id) return; draft = {open:true, counter:true, to:o.from, give:o.take.slice(), take:o.give.slice(), cg:o.ct, ct:o.cg}; render(); break; }
    case 'tclose': draft = {open:false, to:null, give:[], take:[], cg:0, ct:0}; render(); break;
    case 'tto': draft.to = id; draft.take = []; render(); break;
    case 'tpick': { const L = draft[b.dataset.kind], i = L.indexOf(id); if (i >= 0) L.splice(i,1); else L.push(id); render(); break; }
    case 'tsend': { const o = {to:draft.to, give:draft.give.slice(), take:draft.take.slice(), cg:draft.cg, ct:draft.ct}, fn = draft.counter ? ACT.counter : ACT.propose; draft = {open:false, to:null, give:[], take:[], cg:0, ct:0}; mutate(fn, o); break; }
    case 'zoom': zoomOn = !zoomOn; store.set('nm.zoom', zoomOn ? '1' : '0'); followKey = null; render(); break;
    case 'center': { const m = game && byId(game, me.id); if (m) centerOn(m.pos, 'smooth'); break; }
    case 'tutoOk': tipsSeen.add(id); saveTuto(); coachId = null; render(); break;
    case 'tutoOff': tutoOn = false; saveTuto(); render(); toast('Tutoriel coupé. Tu peux le relancer depuis les règles du jeu.'); break;
    case 'tutoReset': tutoOn = true; tipsSeen.clear(); saveTuto(); coachId = null; render(); toast('Le tutoriel reprend depuis le début.'); break;
    case 'practice': if (!busy) createPractice(); break;
    case 'resolveLot': break;
    case 'evtClose': { const ev = document.getElementById('evt'); if (ev) ev.hidden = true; sheetPid = null; clearTimeout(evtTimer); break; }
    case 'noop': break;
    case 'plOpen': openSheet(id); break;
    case 'tradeWith': { const ev = document.getElementById('evt'); if (ev) ev.hidden = true; sheetPid = null;
      draft = {open:true, to:id, give:[], take:[], cg:0, ct:0}; if (isPhone()) tab = 'joueurs'; else ledger = 'joueurs'; render();
      const t = document.getElementById('sTrade'); if (t) t.scrollIntoView({block:'start', behavior: reducedMotion() ? 'auto' : 'smooth'}); break; }
    case 'feedAll': if (isPhone()) tab = 'journal'; else ledger = 'journal'; render(); break;
    case 'tab': tab = id; render(); try { window.scrollTo({top:0}); } catch(err){} if (id === 'jeu' && game) follow(game, byId(game, me.id), game.status === 'playing' && cur(game).id === me.id, true); break;
    case 'ledger': ledger = id; render(); break;
    case 'pfView': pfView = id; render(); break;
    case 'mkFilter': mkFilter = id; render(); break;
    case 'mkOpen': mkOpen = mkOpen === id ? null : id; render(); break;
    case 'goZone': {
      const i = CELLS.findIndex(c => c.t === 'pays' && c.z === id); if (i < 0) return;
      sel = i; tab = 'jeu'; render(); centerOn(i, 'smooth');
      const d = document.getElementById('sDetail'); if (d && window.matchMedia('(max-width:900px)').matches) d.scrollIntoView({block:'start', behavior: reducedMotion() ? 'auto' : 'smooth'});
      break;
    }
    default: if (ACT[a]) mutate(ACT[a], id);
  }
});
app.addEventListener('toggle', e => { if (e.target && e.target.id === 'edMore') edMoreOpen = e.target.open; }, true);
/* Loupe : au survol d'une case (souris uniquement), un encadré lisible montre la case en grand. */
const tipEl = document.createElement('div'); tipEl.className = 'celltip'; tipEl.hidden = true; document.body.appendChild(tipEl);
let tipCell = -1;
app.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || !game || !matchMedia('(hover:hover) and (pointer:fine)').matches){ return; }
  const c = e.target.closest && e.target.closest('#board .cell');
  if (!c){ if (!tipEl.hidden){ tipEl.hidden = true; tipCell = -1; } return; }
  const i = Number(c.dataset.id);
  if (i !== tipCell){ tipCell = i; applyRules(game.rules); applyTheme(game.options.theme); tipEl.innerHTML = tipHTML(game, i); }
  tipEl.hidden = false;
  const W = tipEl.offsetWidth, H = tipEl.offsetHeight;
  let x = e.clientX + 18, y = e.clientY + 18;
  if (x + W > innerWidth - 8) x = e.clientX - W - 18; if (y + H > innerHeight - 8) y = e.clientY - H - 18;
  tipEl.style.transform = `translate(${Math.max(8,x)}px, ${Math.max(8,y)}px)`;
});
app.addEventListener('pointerleave', () => { tipEl.hidden = true; tipCell = -1; });
app.addEventListener('submit', e => {
  if (e.target.id === 'joinForm'){ e.preventDefault(); joinByCode(); }
  if (e.target.id === 'chatForm'){ e.preventDefault(); const i = document.getElementById('chatIn'), v = i ? i.value.trim() : '';
    if (!v) return; if (busy){ toast('Une seconde, une action est en cours…'); return; } i.value = ''; mutate(ACT.say, v, true); }
});
document.addEventListener('click', e => { if (menuOpen && !e.target.closest('.menuwrap')){ menuOpen = false; render(); } });
app.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.trow.pickable, .pl.tap')){ e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape'){ const ev = document.getElementById('evt'); if (ev && !ev.hidden){ ev.hidden = true; sheetPid = null; } } });
app.addEventListener('input', e => {
  if (e.target.id === 'tGive') draft.cg = Math.max(0, Math.round((+e.target.value || 0)*1000/100)*100);
  if (e.target.id === 'tTake') draft.ct = Math.max(0, Math.round((+e.target.value || 0)*1000/100)*100);
  const send = app.querySelector('[data-act="tsend"]');
  if (send && game){ send.disabled = busy || !canWrite || !draftOk(game, byId(game, me.id)); }
});
app.addEventListener('focusout', e => { if (e.target.id === 'tGive' || e.target.id === 'tTake') setTimeout(() => { const ae = document.activeElement; if (game && !(ae && ae.tagName === 'INPUT' && (ae.id === 'tGive' || ae.id === 'tTake'))) render(); }, 0); });

/* =================== DÉMARRAGE =================== */
/* La liste des parties n'est suivie qu'à l'accueil : en partie, on économise le quota Firebase. */
let unsubList = null, cleaned = false, listLoaded = false;
function listWatch(on){
  if (!db) return;
  if (!on){ if (unsubList){ unsubList(); unsubList = null; } return; }
  if (unsubList) return;
  unsubList = db.collection('games').orderBy('updatedAt','desc').limit(40).onSnapshot(snap => {
    games = snap.docs.map(d => Object.assign({_id: d.id}, d.data())).filter(g => { try { return validGame(g) && !!cleanGame(g); } catch(e){ return false; } });
    cleanOld();
    if (!gid && view === 'lobby') renderLobby();
    listLoaded = true;
  }, () => toast('La liste des parties ne se met plus à jour. Recharge la page.')) || (() => {});
}
/* Ménage : l'auteur efface ses parties abandonnées depuis plus de 7 jours. */
function cleanOld(){
  if (cleaned || !canWrite || !me.id) return; cleaned = true;
  games.filter(g => g.by === me.id && Date.now() - (g.updatedAt || 0) > 7*864e5).slice(0, 10).forEach(g => { db.doc('games/' + g._id).delete().catch(() => {}); });
}
(async function boot(){
  const C = window.claude;
  if (C && C.use){ try { [db, userCap] = await Promise.all([C.use('db'), C.use('user')]); } catch(e){} }
  if (!db){
    app.innerHTML = `<header class="top"><div class="logo">Négoce <span>Mondial</span></div></header><div class="loading"><p><b>Le jeu en ligne n'est pas disponible ici.</b></p><p class="note">Connexion à Firebase impossible. Vérifie le fichier firebase-config.js et que la connexion anonyme et Firestore sont activés.</p></div>`;
    return;
  }
  if (userCap){
    me.id = await userCap.id();
    const w = await userCap.can('data.write'); if (w === false) canWrite = false;
    me.name = store.get('nm.pseudo') || (await userCap.name()) || '';
  }
  if (!me.id) canWrite = false;
  const hm = (location.hash || '').match(/^#([A-Za-z0-9]{4})$/); pendingCode = hm ? hm[1].toUpperCase() : null;
  render();
  if (pendingCode){ const c = pendingCode; pendingCode = null; const g = await findByCode(c);
    if (g) openGame(g._id); else { toast(`La partie ${c} n'existe plus.`); try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} } }
  if (!gid) listWatch(true);
  db.collection('rulesets').orderBy('updatedAt','desc').limit(50).onSnapshot(snap => {
    presets = snap.docs.map(d => Object.assign({id: d.id}, d.data())).filter(p => p && p.name && p.rules);
    if (!gid && view === 'lobby') renderLobby();
  }, () => {});
  const last = gid ? null : store.get('nm.game');
  if (last){
    try { const snap = await db.doc('games/' + last).get(); const d = snap.exists ? snap.data() : null;
      if (d && d.v === 3 && d.status !== 'closed' && d.players.some(p => p.id === me.id)) openGame(last); else store.set('nm.game', null); } catch(e){}
  }
})();
})();
